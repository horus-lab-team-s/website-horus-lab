# ==============================================================================
# Horus-Lab — blocs serveur à AJOUTER dans le reverse proxy Nginx EXISTANT
# (conteneur `backend-nginx-1`, projet afrikamode, qui sert déjà 80/443).
#
# Déploiement : ce fichier est copié dans le conteneur nginx à
#   /etc/nginx/conf.d/horus.conf  puis  `nginx -t && nginx -s reload`.
#   (nginx charge tout /etc/nginx/conf.d/*.conf)
#
# Valeurs RÉELLES du VPS (relevées via `nginx -T` / `docker inspect`) :
#   - webroot ACME .......... /var/www/certbot         (volume backend_certbot_www)
#   - certificats ........... /etc/letsencrypt/...      (volume backend_certbot_certs)
#   - certificat horus ...... /etc/letsencrypt/live/horus-lab.com/ (4 noms, dont
#                             zayra.technologies.horus-lab.com — voir ZAYRA-SOUS-DOMAINE.md)
#   - certificat zayra ...... /etc/letsencrypt/live/zayra-technologies.com/ (apex + www)
#   - upstreams par NOM ..... horus_frontend:3000 / zayra_frontend:3000 / horus_web:8000
#                             (réseau backend_default)
#
# Motif `resolver 127.0.0.11` + `set $up` (comme gathe-finance.conf) : nginx
# ré-résout les noms à l'exécution -> un `up -d` qui recrée horus_web/horus_frontend
# (nouvelle IP) NE casse PAS le proxy, aucun reload nécessaire après un redéploiement.
# ==============================================================================

# --- HTTP : challenge ACME (renouvellement) + redirection vers HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name horus-lab.com www.horus-lab.com api.horus-lab.com zayra.technologies.horus-lab.com
                zayra-technologies.com www.zayra-technologies.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS : site public Horus-Lab (horus-lab.com + www) -> frontend Next ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name horus-lab.com www.horus-lab.com;

    ssl_certificate     /etc/letsencrypt/live/horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horus-lab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $up http://horus_frontend:3000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS : site Zayra Technologies (zayra-technologies.com) -> frontend Next
# construit en marque Zayra. Conteneur dédié (zayra_frontend) : titres, balises
# canoniques et sitemap propres à Zayra, pour son référencement Google.
# Certificat dédié : /etc/letsencrypt/live/zayra-technologies.com/ (apex + www).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zayra-technologies.com;

    ssl_certificate     /etc/letsencrypt/live/zayra-technologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayra-technologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $up http://zayra_frontend:3000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS : www.zayra-technologies.com -> zayra-technologies.com (définitif) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zayra-technologies.com;

    ssl_certificate     /etc/letsencrypt/live/zayra-technologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zayra-technologies.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://zayra-technologies.com$request_uri;
}

# --- HTTPS : ancien sous-domaine zayra.technologies.horus-lab.com ---
# Redirection définitive vers zayra-technologies.com (même chemin) : visiteurs,
# liens partagés et référencement Google passent au nouveau domaine.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zayra.technologies.horus-lab.com;

    ssl_certificate     /etc/letsencrypt/live/horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horus-lab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Validation Google Search Console de l'ancienne propriété : à garder, elle
    # sert à l'outil « Changement d'adresse » vers zayra-technologies.com.
    location = /google5c6833a3e3dc2c6d.html {
        default_type text/html;
        return 200 "google-site-verification: google5c6833a3e3dc2c6d.html";
    }

    location / {
        return 301 https://zayra-technologies.com$request_uri;
    }
}

# --- HTTPS : API + admin (api.horus-lab.com) -> web Django ---
# L'app sert elle-même /static (WhiteNoise) et /media (config/urls.py) : un seul
# proxy_pass suffit, aucun volume à monter dans le proxy.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.horus-lab.com;

    ssl_certificate     /etc/letsencrypt/live/horus-lab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horus-lab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 25m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $up http://horus_web:8000;
        proxy_pass $up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
